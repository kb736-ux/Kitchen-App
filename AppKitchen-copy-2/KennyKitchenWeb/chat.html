<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="assets/favicon.png" sizes="192x192" />
    <link rel="icon" type="image/png" href="assets/favicon-32.png" sizes="32x32" />
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
    <title>Sheek - Chat</title>
    <link rel="stylesheet" href="tokens.css">
    <link rel="stylesheet" href="styles.css?v=20260319">
    <link rel="stylesheet" href="chat.css?v=20260910b">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="dashboard-container">
        <!-- Top Navigation -->
        <nav class="top-nav">
            <div class="nav-brand">
                <img src="assets/logo.png" alt="" class="nav-logo" width="36" height="36">
                <span>Sheek</span>
            </div>
            <div class="nav-tabs">
                <button class="nav-tab" data-tab="home" onclick="window.location.href='index.html'">
                    <i class="fas fa-home"></i>
                    Home
                </button>
                <button class="nav-tab" data-tab="scheduling" onclick="window.location.href='scheduling.html'">
                    <i class="fas fa-calendar-alt"></i>
                    Scheduling
                </button>
                <button class="nav-tab" data-tab="employees" onclick="window.location.href='employees.html'">
                    <i class="fas fa-users"></i>
                    Employees
                </button>
                <button class="nav-tab" data-tab="recipes" onclick="window.location.href='recipes.html'">
                    <i class="fas fa-book"></i>
                    Recipes
                </button>
                <button class="nav-tab" data-tab="inventory" onclick="window.location.href='inventory.html'">
                    <i class="fas fa-boxes"></i>
                    Inventory
                </button>
                <button class="nav-tab active" data-tab="chat">
                    <i class="fas fa-comments"></i>
                    Chat
                </button>
            </div>
            <div class="nav-user">
                <div class="notification-bell" title="Notifications">
                    <i class="fas fa-bell"></i>
                    <span class="notification-badge" id="nav-notif-badge" style="display:none;">0</span>
                </div>
                <div class="user-profile">
                    <img src="data:image/gif;base64,R0lGODlhAQABAAAAACwAAAAAAQABAAA=" alt="User" class="user-avatar">
                    <span>Admin</span>
                </div>
            </div>
        </nav>

        <!-- Main Chat Content -->
        <main class="dashboard-main chat-main">
            <div class="chat-layout">
                <!-- Sidebar: Conversations List -->
                <aside class="chat-sidebar">
                    <div class="chat-sidebar-header">
                        <h2>Messages</h2>
                        <div class="chat-actions">
                            <button type="button" class="btn-chat-action" id="btn-new-message" title="New message">
                                <i class="fas fa-plus"></i>
                            </button>
                            <button type="button" class="btn-chat-action btn-manager-only" id="btn-create-group" title="New group" hidden>
                                <i class="fas fa-users"></i>
                            </button>
                        </div>
                    </div>
                    <div class="conversations-list">
                        <!-- Conversation rows are rendered dynamically from Supabase -->
                    </div>
                </aside>

                <!-- Main Chat Area -->
                <div class="chat-main-area">
                    <div class="chat-card">
                        <div class="chat-header">
                            <h2 id="chat-title"><i class="fas fa-bullhorn"></i><span>Announcements</span></h2>
                        </div>
                        <div class="chat-thread" id="chat-thread" data-chat-kind="announcements">
                            <div class="chat-empty">No announcements yet.</div>
                        </div>
                        <div class="chat-input-area">
                            <div class="chat-input-wrap">
                                <input type="text" id="chat-message-input" class="chat-input" placeholder="Message" autocomplete="one-time-code" name="chat-msg-nofill" data-form-type="other">
                                <button type="button" class="chat-send-btn" id="chat-send-btn" title="Send message">
                                    <i class="fas fa-paper-plane"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- New Message Modal (Direct Message) -->
    <div class="modal-overlay" id="new-message-modal">
        <div class="modal modal-chat">
            <div class="modal-header">
                <h3>New message</h3>
                <button type="button" class="modal-close" id="close-new-message" aria-label="Close">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="dm-recipient">To</label>
                    <select id="dm-recipient" class="form-control">
                        <option value="">Select teammate…</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="dm-message">Message</label>
                    <textarea id="dm-message" class="form-control" rows="4" placeholder="Type your message..."></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn-secondary" id="cancel-new-message">Cancel</button>
                <button type="button" class="btn-primary" id="send-dm">
                    <i class="fas fa-paper-plane"></i> Send
                </button>
            </div>
        </div>
    </div>

    <!-- Create Group Chat Modal (Managers Only) -->
    <div class="modal-overlay" id="create-group-modal">
        <div class="modal modal-chat">
            <div class="modal-header">
                <h3>Create Group Chat</h3>
                <button type="button" class="modal-close" id="close-create-group" aria-label="Close">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="group-name">Group name</label>
                    <input type="text" id="group-name" class="form-control" placeholder="e.g. Kitchen Team">
                </div>
                <div class="form-group">
                    <label>Members <span style="font-weight:400;color:#a0aec0;">(optional)</span></label>
                    <div class="member-select-list">
                    </div>
                    <p class="member-hint">Anyone on the team can open the group. Members are notified if they have the app.</p>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn-secondary" id="cancel-create-group">Cancel</button>
                <button type="button" class="btn-primary" id="create-group">
                    <i class="fas fa-check"></i> Create Group
                </button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="tokens.js"></script>
    <script src="supabase-config.js?v=20260320"></script>
    <script src="subscriptionPlans.js?v=1"></script>
    <script src="stripeBilling.js?v=1"></script>
    <script src="auth.js?v=20260910"></script>
    <script src="adminSettings.js?v=20260319"></script>
    <script src="script.js?v=20260319c"></script>
    <script src="chat.js?v=20260910c"></script>
</body>
</html>
