<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Restaurant details — Sheek</title>
  <meta name="description" content="Name your restaurant and start your per-user Sheek subscription." />
  <link rel="icon" type="image/png" href="/favicon.png" sizes="512x512" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
  <link rel="stylesheet" href="../styles.css" />
</head>
<body class="onboard-wizard-body">
  <header class="site-header onboard-wizard-header">
    <div class="wrap header-inner">
      <a href="../index.html" class="logo">
        <i class="fas fa-utensils logo-icon" aria-hidden="true"></i>
        Sheek
      </a>
      <nav class="nav-desktop" aria-label="Primary">
        <a href="../index.html#features">Features</a>
        <a href="../index.html#pricing">Pricing</a>
        <a href="index.html">Onboard</a>
        <a href="../onboarding-guide.html">Setup guide</a>
      </nav>
      <div class="header-actions">
        <a class="btn btn-ghost" data-sheek-login href="#">Log in</a>
      </div>
    </div>
  </header>

  <main class="onboard-wizard-main">
    <div class="wrap onboard-wizard-inner">
      <p class="onboard-step-pill">Step 2 of 3</p>
      <h1 class="onboard-wizard-title">Restaurant details</h1>
      <p class="onboard-wizard-lead">Name your restaurant as it should appear in Sheek for your team.</p>

      <div class="onboarding-lead-card onboard-wizard-card onboard-wizard-card-wide">
        <form id="onboard-step2-form" class="onboarding-lead-form">
          <div class="onboarding-field onboarding-field-full">
            <label for="ob-restaurant">Restaurant name</label>
            <input id="ob-restaurant" name="restaurant_name" type="text" autocomplete="organization" placeholder="e.g. Northside Diner" required />
          </div>
          <div class="onboard-pricing-display" style="margin-top:12px;padding:14px 16px;border:2px solid #dcfce7;border-radius:12px;background:#f0fdf4;">
            <div style="font-weight:700;font-size:15px;color:#166534;margin-bottom:4px;">$3.00/user/mo</div>
            <div style="font-size:13px;color:#4b5563;line-height:1.45;">$2.50/user/mo for 30+ employees. No caps — add as many staff as you need.</div>
            <input type="hidden" name="plan" value="per_user" />
          </div>
          <p id="ob2-err" class="onboarding-lead-error" role="alert" hidden></p>
          <div class="onboard-wizard-actions">
            <a class="btn btn-outline" href="index.html">Back</a>
            <button type="submit" class="btn btn-primary">Continue</button>
          </div>
        </form>
      </div>
    </div>
  </main>

  <script src="../sheek-dashboard-public.js"></script>
  <script src="../onboard-config.js"></script>
  <script src="../site-config.js"></script>
  <script src="onboard.js"></script>
  <script>
    (function () {
      document.addEventListener("DOMContentLoaded", function () {
        if (!window.sheekOnboard.require(["first_name", "last_name", "email"], "index.html")) return;

        var form = document.getElementById("onboard-step2-form");
        var errEl = document.getElementById("ob2-err");
        form.addEventListener("submit", function (e) {
          e.preventDefault();
          errEl.textContent = "";
          errEl.setAttribute("hidden", "");
          var name = String(document.getElementById("ob-restaurant").value || "").trim();
          if (!name) {
            errEl.textContent = "Enter your restaurant name.";
            errEl.removeAttribute("hidden");
            return;
          }
          window.sheekOnboard.save({ restaurant_name: name, plan: "per_user" });
          window.location.href = "payment.html";
        });
      });
    })();
  </script>
  <script src="../main.js"></script>
</body>
</html>
