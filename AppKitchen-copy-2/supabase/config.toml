# Supabase CLI — https://supabase.com/docs/guides/cli
# Run from repo: supabase functions deploy stripe-checkout stripe-portal stripe-webhook stripe-onboard-checkout onboard-complete-signup

[functions.stripe-checkout]
verify_jwt = true

[functions.stripe-portal]
verify_jwt = true

# Embedded Payment Element (custom on-site card form)
[functions.stripe-subscribe-elements]
verify_jwt = true

[functions.stripe-webhook]
verify_jwt = false

# Public marketing onboarding (Stripe Checkout; org in webhook; auth user after payment)
[functions.stripe-onboard-checkout]
verify_jwt = false

[functions.onboard-complete-signup]
verify_jwt = false
