<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kenny Kitchen - Employee Setup</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body style="background:#0f172a;margin:0;font-family:'Inter',system-ui,-apple-system,BlinkMacSystemFont,sans-serif;">
  <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;">
    <div id="onboard-card" style="width:100%;max-width:420px;background:white;border-radius:18px;padding:24px 22px;box-shadow:0 18px 40px rgba(0,0,0,0.45);">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px;">
        <div style="width:40px;height:40px;border-radius:999px;background:#e8f5e9;display:flex;align-items:center;justify-content:center;">
          <span style="font-size:20px;">👋</span>
        </div>
        <div>
          <div style="font-size:18px;font-weight:700;color:#111827;">Welcome to Kenny Kitchen</div>
          <div id="onboard-subtitle" style="font-size:13px;color:#6b7280;margin-top:2px;">Finishing your account setup…</div>
        </div>
      </div>
      <div id="onboard-body" style="font-size:14px;color:#4b5563;line-height:1.5;">
        <p>Checking your invite and linking you to the restaurant. This only takes a moment.</p>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="employeeOnboard.js"></script>
</body>
</html>
